name: Build Reservation-API

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'reserveration-api/**'
      - '.github/workflows/build-reservation-api.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'reserveration-api/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        id: setup-cli
        env:
         JF_URL: https://${{ vars.JF_URL }}/
        with:
         oidc-provider-name: jfrog-github-oidc
    
      - name: Set CLI Config
        run: jf npm-config --global=true --repo-resolve=llpd-npm --repo-deploy=llpd-npm
        

      - name: Install dependencies
        working-directory: ./reserveration-api
        run: jf npm ci

      - name: Run tests
        working-directory: ./reserveration-api
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.JFROG_REGISTRY_URL }}
          username: ${{ steps.setup-cli.outputs.oidc-user }}
          password: ${{ steps.setup-cli.outputs.oidc-token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ JFROG_REGISTRY_URL }}/lilypad-reservation-api
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./reserveration-api
          file: ./reserveration-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment PR with image info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Reservation-API build and tests passed! 🍽️'
            })
