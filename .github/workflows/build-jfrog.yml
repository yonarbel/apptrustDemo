name: Build & Push to JFrog

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  JFROG_REGISTRY: ${{ secrets.JFROG_REGISTRY_URL }}

jobs:
  build-and-push-jfrog:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: cashier-web
            dockerfile: ./cashier-web/Dockerfile
            context: ./cashier-web
            image_name: apptrust/cashier-web
          - name: kitchen-worker
            dockerfile: ./kitchen-worker/Dockerfile
            context: ./kitchen-worker
            image_name: apptrust/kitchen-worker
          - name: reservation-api
            dockerfile: ./reserveration-api/Dockerfile
            context: ./reserveration-api
            image_name: apptrust/reservation-api
      max-parallel: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [[ "$VERSION" == "refs/tags/"* ]]; then
            VERSION=${GITHUB_SHA:0:8}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Log in to JFrog Artifactory
        uses: docker/login-action@v3
        with:
          registry: ${{ env.JFROG_REGISTRY }}
          username: ${{ secrets.JFROG_USERNAME }}
          password: ${{ secrets.JFROG_PASSWORD }}

      - name: Build and push ${{ matrix.service.name }} to JFrog
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.JFROG_REGISTRY }}/${{ matrix.service.image_name }}:${{ steps.version.outputs.version }}
            ${{ env.JFROG_REGISTRY }}/${{ matrix.service.image_name }}:${{ steps.version.outputs.date }}
            ${{ env.JFROG_REGISTRY }}/${{ matrix.service.image_name }}:latest
          labels: |
            org.opencontainers.image.title=${{ matrix.service.name }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## 🐸 JFrog AppTrust Release

            **Images pushed to JFrog Artifactory:**

            - `${{ env.JFROG_REGISTRY }}/apptrust/cashier-web:${{ steps.version.outputs.version }}`
            - `${{ env.JFROG_REGISTRY }}/apptrust/kitchen-worker:${{ steps.version.outputs.version }}`
            - `${{ env.JFROG_REGISTRY }}/apptrust/reservation-api:${{ steps.version.outputs.version }}`
          draft: false
          prerelease: false

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Successfully built and pushed to JFrog!"
          echo "Registry: ${{ env.JFROG_REGISTRY }}"
          echo "Version: ${{ steps.version.outputs.version }}"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Build or push to JFrog failed!"
          exit 1
