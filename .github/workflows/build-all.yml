name: Build All Services

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  GITHUB_REGISTRY: ghcr.io

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: cashier-web
            dockerfile: ./cashier-web/Dockerfile
            context: ./cashier-web
            image_name: cashier-web
          - name: kitchen-worker
            dockerfile: ./kitchen-worker/Dockerfile
            context: ./kitchen-worker
            image_name: kitchen-worker
          - name: reservation-api
            dockerfile: ./reserveration-api/Dockerfile
            context: ./reserveration-api
            image_name: reservation-api
      max-parallel: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.image_name }}
            ${{ env.GITHUB_REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.image_name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-services:
    runs-on: ubuntu-latest
    needs: build-matrix
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test cashier-web
        run: |
          cd cashier-web
          pip install -r requirements.txt
          python -m pytest test_app.py -v

      - name: Test kitchen-worker
        run: |
          cd kitchen-worker
          go test -v

      - name: Test reservation-api
        run: |
          cd reserveration-api
          npm install
          npm test

  notify:
    runs-on: ubuntu-latest
    needs: build-matrix
    if: always()

    steps:
      - name: Build Status
        run: |
          if [ "${{ needs.build-matrix.result }}" == "success" ]; then
            echo "✅ All services built successfully! 🐸"
          else
            echo "❌ Build failed for one or more services"
          fi
